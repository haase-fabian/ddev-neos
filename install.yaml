name: neos
ddev_version_constraint: '>= v1.24.3'
pre_install_actions:
- mkdir -p Configuration/Development/Ddev
- |
  cat <<EOF >Configuration/Development/Ddev/Settings.ddev.yaml
  Neos:
    Flow:
      http:
        trustedProxies:
          proxies: "*"
  
      persistence:
        backendOptions:
          driver: pdo_mysql
          host: db
          dbname: db
          user: db
          password: db
  
    Imagine:
      driver: Imagick
  
    SwiftMailer:
      transport:
        type: 'Swift_SmtpTransport'
        options:
          host: 'localhost'
          port: '1025'
          encryption: ~
          username: ~
          password: ~
          localDomain: 'example.com'

  EOF

project_files:
- config.neos.yaml
- docker-compose.neos.yaml
- commands/web/flow

